<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas & Donasi Maulid</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        const sheetId = '16bc8UiTpSYewlUsYszIOoGadHWztTsdN6ERtLey7Htw';
        const endpoint = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
        const targetPerOrang = 500000;
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        fetch(endpoint)
            .then(res => res.text())
            .then(text => {
                const jsonStr = text.substring(47).slice(0, -2);
                const data = JSON.parse(jsonStr);
                const rows = data.table.rows;
                
                const tbody = document.getElementById('tabelAnggota');
                const listTerbaru = document.getElementById('listTerbaru');
                tbody.innerHTML = ''; 
                listTerbaru.innerHTML = '';
                
                let totalTerkumpul = 0;
                let nomorUrut = 1;
                let riwayatTransfer = []; // Array untuk menampung yang sudah transfer

                rows.forEach((row) => {
                    if (!row.c || !row.c[1] || !row.c[1].v || row.c[1].v.toString().includes('TOTAL')) return;

                    const nama = row.c[1].v.toString();
                    const bayar = row.c[2] ? Number(row.c[2].v) || 0 : 0;
                    const namaLower = nama.toLowerCase();
                    totalTerkumpul += bayar;

                    let statusHTML = '';
                    
                    if (namaLower.includes('hamba allah') || namaLower.includes('donatur') || namaLower.includes('umum') || namaLower.includes('infaq')) {
                        statusHTML = '<span class="inline-flex items-center justify-center bg-blue-50 text-blue-600 py-1 px-3 rounded-full text-xs font-semibold border border-blue-100"><i class="fa-solid fa-heart text-[10px] mr-1"></i> Donasi</span>';
                    } else if (bayar >= targetPerOrang) {
                        statusHTML = '<span class="inline-flex items-center justify-center bg-emerald-50 text-emerald-600 py-1 px-3 rounded-full text-xs font-semibold border border-emerald-100"><i class="fa-solid fa-check text-[10px] mr-1"></i> Lunas</span>';
                    } else if (bayar > 0) {
                        statusHTML = '<span class="inline-flex items-center justify-center bg-amber-50 text-amber-600 py-1 px-3 rounded-full text-xs font-semibold border border-amber-100"><i class="fa-solid fa-clock-rotate-left text-[10px] mr-1"></i> Cicil</span>';
                    } else {
                        statusHTML = '<span class="inline-flex items-center justify-center bg-rose-50 text-rose-500 py-1 px-3 rounded-full text-xs font-semibold border border-rose-100"><i class="fa-solid fa-xmark text-[10px] mr-1"></i> Belum</span>';
                    }

                    // Simpan data ke array jika nominal > 0 untuk fitur "Terbaru"
                    if (bayar > 0) {
                        riwayatTransfer.push({ nama, bayar, statusHTML });
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50/50 transition-colors duration-200";
                    tr.innerHTML = `
                        <td class="p-4 text-slate-400 text-center">${nomorUrut++}</td>
                        <td class="p-4 font-semibold text-slate-700">${nama}</td>
                        <td class="p-4 text-emerald-600 font-bold">${formatRupiah(bayar)}</td>
                        <td class="p-4 text-center">${statusHTML}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('totalSaldo').innerText = formatRupiah(totalTerkumpul);

                // --- LOGIKA AKTIVITAS TERBARU ---
                // Ambil 3 transaksi terakhir, lalu balik urutannya (reverse) agar yang paling baru di atas
                const tigaTerbaru = riwayatTransfer.slice(-3).reverse();

                if (tigaTerbaru.length > 0) {
                    tigaTerbaru.forEach(trx => {
                        listTerbaru.innerHTML += `
                            <div class="flex justify-between items-center p-3 bg-white rounded-2xl border border-slate-100 shadow-sm">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center">
                                        <i class="fa-solid fa-hand-holding-dollar"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-slate-700">${trx.nama}</p>
                                        <p class="text-[11px] text-slate-400">Baru saja berpartisipasi</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-sm font-bold text-emerald-600">+${formatRupiah(trx.bayar)}</p>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    listTerbaru.innerHTML = '<div class="text-center p-4 text-slate-400 text-sm">Belum ada transaksi.</div>';
                }
            })
            .catch(error => {
                document.getElementById('tabelAnggota').innerHTML = '<tr><td colspan="4" class="text-center p-8 text-rose-500 bg-rose-50"><i class="fa-solid fa-triangle-exclamation mb-2 text-xl block"></i>Gagal memuat data. Pastikan Google Sheets sudah di-share "Siapa saja memiliki link".</td></tr>';
                document.getElementById('listTerbaru').innerHTML = '<div class="text-center p-4 text-rose-500 text-sm">Gagal memuat data.</div>';
            });

        <!-- Card QRIS & Tombol WA -->
        <div class="glass-card rounded-3xl p-8 mb-6 text-center">
            <h2 class="text-xl font-bold text-slate-800 mb-2"><i class="fa-solid fa-qrcode text-teal-500 mr-2"></i>Transfer via QRIS</h2>
            <p class="text-sm text-slate-500 mb-6">Scan kode QR ini menggunakan M-Banking atau E-Wallet (Dana, GoPay, OVO, ShopeePay).</p>
            
            <div class="flex justify-center mb-6">
                <div class="p-2 bg-white rounded-2xl shadow-md border border-slate-100">
                    <!-- GANTI NAMA FILE GAMBAR DI BAWAH INI SESUAI GAMBAR QRIS ANDA -->
                    <img src="qris.PNG" alt="QRIS Pembayaran" class="rounded-xl max-w-full h-auto w-56 md:w-64">
                </div>
            </div>
            
            <div class="inline-block bg-rose-50 text-rose-600 px-4 py-2 rounded-lg text-xs font-medium border border-rose-100 mb-6 block w-fit mx-auto">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Jangan lupa simpan screenshot bukti transfer Anda.
            </div>

            <!-- Tombol Konfirmasi WA -->
            <div class="mt-2 border-t border-slate-100 pt-6">
                <!-- GANTI 62889699651535 DENGAN NOMOR WA ANDA. PASTIKAN AWALAN 62, BUKAN 0 -->
                <a href="https://wa.me/6289699651535?text=Assalamualaikum%20Bendahara,%20saya%20ingin%20konfirmasi%20transfer%20untuk%20Kas/Donasi%20Maulid.%20Berikut%20saya%20lampirkan%20bukti%20transfernya." target="_blank" class="inline-flex items-center justify-center w-full sm:w-max mx-auto bg-[#25D366] hover:bg-[#128C7E] text-white font-semibold py-3 px-6 rounded-full transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-1">
                    <i class="fa-brands fa-whatsapp text-xl mr-2"></i>
                    Konfirmasi Transfer di Sini
                </a>
            </div>
        </div>

        <!-- Card Laporan Anggota -->
        <div class="glass-card rounded-3xl overflow-hidden mb-6">
            <div class="p-6 border-b border-slate-100 bg-white flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-clipboard-list text-teal-500 mr-2"></i>Laporan Penerimaan</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="p-4 font-semibold border-b border-slate-100 w-12 text-center">No</th>
                            <th class="p-4 font-semibold border-b border-slate-100">Nama Lengkap</th>
                            <th class="p-4 font-semibold border-b border-slate-100">Nominal</th>
                            <th class="p-4 font-semibold border-b border-slate-100 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelAnggota" class="text-sm divide-y divide-slate-50">
                        <tr><td colspan="4" class="text-center p-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat data dari server...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="text-center text-xs text-slate-400 mt-8">
            <p>Diperbarui secara otomatis berdasarkan data terbaru.</p>
        </div>

    </main>

    </script>
</body>
</html>
