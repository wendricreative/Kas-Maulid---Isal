<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas & Donasi Maulid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        .gradient-text { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .month-btn.active { background-color: #10b981; color: white; border-color: #10b981; }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 pb-12">

    <header class="bg-gradient-to-r from-emerald-600 to-teal-500 text-white pt-12 pb-24 px-4 rounded-b-[2rem] shadow-lg">
        <div class="container mx-auto text-center max-w-3xl relative">
            <!-- Tombol Login Bendahara di Pojok Kanan Atas -->
            <button onclick="loginAdmin()" id="btnLogin" class="absolute top-0 right-0 bg-white/20 hover:bg-white/30 text-white text-xs py-1 px-3 rounded-full backdrop-blur-sm transition-all border border-white/30">
                <i class="fa-solid fa-lock mr-1"></i> Admin
            </button>

            <h1 class="text-3xl md:text-4xl font-bold mb-2 mt-4">Kas & Donasi Maulid</h1>
            <p class="text-emerald-50 text-sm md:text-base font-light opacity-90"><i class="fa-solid fa-mosque mr-2"></i>Transparan & Mudah</p>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-3xl -mt-16 relative z-10">
        
        <!-- Card Saldo -->
        <div class="glass-card rounded-3xl p-8 mb-6 text-center transform transition duration-500 hover:scale-[1.02]">
            <h2 class="text-slate-500 font-medium mb-1 text-sm uppercase tracking-wider">Total Dana Terkumpul</h2>
            <div class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 gradient-text mb-2" id="totalSaldo">Memuat...</div>
        </div>

        <!-- FITUR UPDATE SALDO (Disembunyikan secara default, hanya muncul setelah login) -->
        <div id="adminSection" class="hidden glass-card rounded-3xl p-6 mb-6 border-l-4 border-emerald-500 relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-emerald-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl uppercase tracking-wider">Mode Bendahara</div>
            <h2 class="text-lg font-bold text-slate-800 mb-4 mt-2"><i class="fa-solid fa-bolt text-amber-500 mr-2"></i>Update Saldo Otomatis</h2>
            <form id="formUpdate" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Anggota / Donatur</label>
                    <input type="text" id="inputNama" required placeholder="Contoh: Andi atau Hamba Allah" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-2">Ketuk Bulan Pembayaran (Opsional)</label>
                    <div class="grid grid-cols-4 gap-2" id="monthGrid"></div>
                    <input type="hidden" id="inputBulan">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nominal (Rp)</label>
                    <input type="number" id="inputNominal" required placeholder="Contoh: 100000" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="btnSubmit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center">
                        <i class="fa-solid fa-check-circle mr-2"></i> Update Saldo
                    </button>
                    <button type="button" onclick="logoutAdmin()" class="bg-rose-100 hover:bg-rose-200 text-rose-600 font-bold py-3 px-4 rounded-xl transition-all">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Card QRIS -->
        <div class="glass-card rounded-3xl p-8 mb-6 text-center">
            <h2 class="text-xl font-bold text-slate-800 mb-2"><i class="fa-solid fa-qrcode text-teal-500 mr-2"></i>Transfer via QRIS</h2>
            <div class="flex justify-center mb-6 mt-4">
                <div class="p-2 bg-white rounded-2xl shadow-md border border-slate-100">
                    <img src="qris.jpg" alt="QRIS" class="rounded-xl max-w-full h-auto w-56">
                </div>
            </div>
            <a href="https://wa.me/6281234567890" target="_blank" class="inline-flex items-center justify-center bg-[#25D366] text-white font-semibold py-2 px-6 rounded-full shadow-md text-sm">
                <i class="fa-brands fa-whatsapp text-lg mr-2"></i> Konfirmasi Transfer ke Bendahara
            </a>
        </div>

        <!-- Tabel Laporan -->
        <div class="glass-card rounded-3xl overflow-hidden mb-6">
            <div class="p-6 border-b border-slate-100 bg-white">
                <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-clipboard-list text-teal-500 mr-2"></i>Laporan Penerimaan</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase">
                            <th class="p-4 font-semibold border-b">Nama</th>
                            <th class="p-4 font-semibold border-b">Nominal</th>
                            <th class="p-4 font-semibold border-b text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelAnggota" class="text-sm divide-y divide-slate-50">
                        <tr><td colspan="3" class="text-center p-8 text-slate-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const sheetId = '16bc8UiTpSYewlUsYszIOoGadHWztTsdN6ERtLey7Htw';
        const endpoint = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
        const gasUrl = 'https://script.google.com/macros/s/AKfycbz_xNr20ZLOIAIf3GkMkPhgKjHp0GSnooX1zDgXHLv3EleTM5rgxLn6ybGbFGUdiseQ/exec'; // PASTI KAN INI DIISI URL DARI GOOGLE SCRIPT
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        // --- SISTEM LOGIN ADMIN ---
        const PIN_BENDAHARA = "121212"; // UBAH PIN INI SESUAI KEINGINAN ANDA

        function loginAdmin() {
            const pin = prompt("Masukkan PIN Keamanan Bendahara:");
            if (pin === PIN_BENDAHARA) {
                document.getElementById('adminSection').classList.remove('hidden');
                document.getElementById('btnLogin').classList.add('hidden');
            } else if (pin !== null) {
                alert("PIN Salah! Akses ditolak.");
            }
        }

        function logoutAdmin() {
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('btnLogin').classList.remove('hidden');
            alert("Berhasil keluar dari Mode Bendahara.");
        }
        // --------------------------

        // Load Data Tables
        fetch(endpoint)
            .then(res => res.text())
            .then(text => {
                const data = JSON.parse(text.substring(47).slice(0, -2));
                const tbody = document.getElementById('tabelAnggota');
                tbody.innerHTML = ''; 
                let total = 0;

                data.table.rows.forEach((row) => {
                    if (!row.c || !row.c[1] || !row.c[1].v || row.c[1].v.toString().includes('TOTAL')) return;
                    const nama = row.c[1].v.toString();
                    const bayar = row.c[2] ? Number(row.c[2].v) || 0 : 0;
                    total += bayar;

                    let statusHTML = bayar >= 500000 ? '<span class="bg-emerald-50 text-emerald-600 py-1 px-3 rounded-full text-xs font-semibold">Lunas</span>' : 
                                     (bayar > 0 ? '<span class="bg-amber-50 text-amber-600 py-1 px-3 rounded-full text-xs font-semibold">Cicil</span>' : 
                                     '<span class="bg-rose-50 text-rose-500 py-1 px-3 rounded-full text-xs font-semibold">Belum</span>');
                    
                    if (nama.toLowerCase().includes('hamba') || nama.toLowerCase().includes('donatur') || nama.toLowerCase().includes('umum') || nama.toLowerCase().includes('infaq')) {
                        statusHTML = '<span class="bg-blue-50 text-blue-600 py-1 px-3 rounded-full text-xs font-semibold">Donasi</span>';
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-4 font-semibold text-slate-700">${nama}</td>
                            <td class="p-4 text-emerald-600 font-bold">${formatRupiah(bayar)}</td>
                            <td class="p-4 text-center">${statusHTML}</td>
                        </tr>`;
                });
                document.getElementById('totalSaldo').innerText = formatRupiah(total);
            });

        // Setup Bulan Buttons
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
        const grid = document.getElementById('monthGrid');
        
        months.forEach(m => {
            let btn = document.createElement('button');
            btn.type = 'button';
            btn.innerText = m;
            btn.className = "month-btn border border-slate-200 text-slate-500 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-50 transition-colors";
            btn.onclick = () => {
                document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('inputBulan').value = m;
            };
            grid.appendChild(btn);
        });

        // Handle Form Submit
        document.getElementById('formUpdate').addEventListener('submit', function(e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';
            btnSubmit.disabled = true;

            const formBody = new URLSearchParams({
                'nama': document.getElementById('inputNama').value,
                'nominal': document.getElementById('inputNominal').value,
                'bulan': document.getElementById('inputBulan').value
            });

            fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formBody
            }).then(() => {
                alert('Saldo berhasil diupdate! Halaman akan dimuat ulang.');
                window.location.reload();
            }).catch(() => {
                alert('Terjadi kesalahan koneksi. Pastikan URL Google Script sudah benar.');
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
